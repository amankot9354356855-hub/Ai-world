<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Status — AI Viral World</title><style>body{margin:0;background:#080a12;color:#fff;font-family:system-ui}.wrap{max-width:650px;margin:auto;padding:30px 18px}.card{background:#111522;border:1px solid #2a3044;border-radius:22px;padding:24px;margin-top:20px}.input,button{width:100%;padding:14px;border-radius:12px;box-sizing:border-box;margin-top:10px}.input{background:#0b0e17;color:#fff;border:1px solid #30364b}button{background:#7c5cff;color:#fff;border:0;font-weight:800}.status{margin-top:18px;padding:18px;border-radius:14px;background:#181d2c;line-height:1.7}a{color:#b5a4ff;font-weight:800}</style></head><body><div class="wrap"><a href="/">← Back to store</a><h1>Order Status</h1><div class="card"><input id="id" class="input" placeholder="Enter Order ID e.g. AVW-1234ABCD"><button onclick="check()">CHECK STATUS</button><div id="out"></div></div></div><script>const p=new URLSearchParams(location.search);if(p.get('id'))document.getElementById('id').value=p.get('id');async function check(){const id=document.getElementById('id').value.trim();const out=document.getElementById('out');const r=await fetch('/api/orders/'+encodeURIComponent(id));const j=await r.json();if(!r.ok){out.innerHTML='<div class="status">'+j.error+'</div>';return}let text='<div class="status"><b>Order:</b> '+j.id+'<br><b>Status:</b> '+j.status.toUpperCase()+'<br><b>Amount:</b> ₹'+j.amount+'<br><b>Name:</b> '+j.name;if(j.status==='approved')text+='<br><br>🎉 <b>Payment approved!</b><br><a href="'+j.access_url+'">OPEN PRODUCT ACCESS →</a>';else if(j.status==='pending')text+='<br><br>⏳ Your payment is waiting for manual review.';else text+='<br><br>❌ This order was rejected. Please contact WhatsApp support.';out.innerHTML=text+'</div>'}</script></body></html>
