<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Viral World — Orders</title><style>body{font-family:system-ui;margin:0;background:#070a16;color:#fff}.wrap{max-width:1000px;margin:auto;padding:24px}.box{background:#10162a;border:1px solid #2c3550;border-radius:18px;padding:20px;margin:16px 0}input,button{padding:12px;border-radius:10px;border:1px solid #38415d;background:#0a0f20;color:#fff}button{cursor:pointer;background:#7956ff;border:0;font-weight:800}.danger{background:#9e3155}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#9ba5bd;font-size:13px}.order{border-top:1px solid #293149;padding:18px 0}.ok{color:#72e3a5}.pending{color:#ffd36a}</style></head><body><div class="wrap"><h1>📦 Order Review</h1><p class="muted">Approve an order only after you independently confirm the ₹199 payment.</p><div class="box"><div class="row"><input id="token" type="password" placeholder="Admin token" style="min-width:260px"><button onclick="load()">LOGIN / REFRESH</button></div><p class="muted">Token is stored only in this browser session.</p></div><div id="orders"></div></div><script>let T=sessionStorage.getItem('avw_admin')||'';document.getElementById('token').value=T;async function load(){T=document.getElementById('token').value.trim();sessionStorage.setItem('avw_admin',T);let r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+T}});if(!r.ok){document.getElementById('orders').innerHTML='<div class="box">❌ Login failed.</div>';return}let os=await r.json();document.getElementById('orders').innerHTML=os.map(o=>`<div class="box order"><b>${o.id}</b> <span class="${o.status==='approved'?'ok':'pending'}">${o.status}</span><p>Name: ${esc(o.name)}<br>Phone: ${esc(o.phone)}<br>Email: ${esc(o.email||'-')}<br>UTR: <b>${esc(o.utr)}</b><br>Amount: ₹${(o.amount/100).toFixed(2)}<br>Created: ${new Date(o.createdAt).toLocaleString()}</p>${o.status==='pending_review'?`<div class="row"><button onclick="act('${o.id}','approve')">✅ APPROVE & RELEASE</button><button class="danger" onclick="act('${o.id}','reject')">REJECT</button></div>`:''}${o.status==='approved'?`<p>Access: <a href="/access/${o.accessToken}" target="_blank" style="color:#7ee7ff">Open access page</a></p>`:''}</div>`).join('')||'<div class="box">No orders yet.</div>'}async function act(id,a){let r=await fetch('/api/admin/orders/'+id+'/'+a,{method:'POST',headers:{Authorization:'Bearer '+T}});if(r.ok)load();else alert('Action failed')}function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}if(T)load();</script></body></html>
