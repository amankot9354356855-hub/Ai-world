<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — AI Viral World</title><style>body{margin:0;background:#080a12;color:#fff;font-family:system-ui}.wrap{max-width:850px;margin:auto;padding:22px}.card{background:#111522;border:1px solid #2a3044;border-radius:20px;padding:22px;margin:16px 0}.input{width:100%;padding:13px;border-radius:11px;box-sizing:border-box;background:#0b0e17;border:1px solid #30364b;color:#fff;margin:7px 0 13px}.btn{padding:13px 18px;border:0;border-radius:11px;background:#7c5cff;color:#fff;font-weight:800;cursor:pointer}.muted{color:#aeb6ca}.pill{padding:5px 9px;border-radius:999px;background:#1d2434}.access{display:inline-block;margin-top:10px;color:#fff;background:#14a36f;padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:800}.hidden{display:none}</style></head><body><div class="wrap"><div id="auth"><div class="card"><h1>Create account</h1><input id="rname" class="input" placeholder="Full name"><input id="remail" class="input" type="email" placeholder="Gmail / Email"><input id="rphone" class="input" placeholder="Mobile / WhatsApp"><input id="rpass" class="input" type="password" placeholder="Password (8+ characters)"><button class="btn" onclick="registerUser()">REGISTER</button><p id="rmsg" class="muted"></p></div><div class="card"><h2>Already have an account?</h2><input id="lemail" class="input" type="email" placeholder="Gmail / Email"><input id="lpass" class="input" type="password" placeholder="Password"><button class="btn" onclick="loginUser()">LOGIN</button><p id="lmsg" class="muted"></p></div></div><div id="dash" class="hidden"><div class="card"><h1>👋 My Account</h1><div id="profile"></div><button class="btn" onclick="logout()">Logout</button></div><div class="card"><h2>Place Order — ₹199</h2><p class="muted">First pay using the QR on the home page, then enter your UTR.</p><a class="access" href="/#order">Open Payment & Order</a></div><div class="card"><h2>My Orders</h2><div id="orders"></div></div></div></div><script>async function me(){const r=await fetch('/api/customer/me');if(r.ok){auth.classList.add('hidden');dash.classList.remove('hidden');const u=await r.json();profile.innerHTML=`<b>${u.name}</b><br>${u.email}<br>${u.phone}`;loadOrders()}}async function registerUser(){const body={name:rname.value,email:remail.value,phone:rphone.value,password:rpass.value};const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();rmsg.textContent=r.ok?'Account created!':j.error;if(r.ok)me()}async function loginUser(){const r=await fetch('/api/customer-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:lemail.value,password:lpass.value})});const j=await r.json();lmsg.textContent=r.ok?'Login successful!':j.error;if(r.ok)me()}async function loadOrders(){const r=await fetch('/api/customer/orders');const d=await r.json();orders.innerHTML=d.length?d.map(o=>`<div style="border-top:1px solid #2a3044;padding:15px 0"><b>${o.id}</b> — ₹${o.amount}<br><span class="pill">${o.status}</span>${o.access_url?`<br><a class="access" href="${o.access_url}">OPEN PRODUCT ACCESS</a>`:''}</div>`).join(''):'No orders yet.'}async function logout(){await fetch('/api/customer-logout',{method:'POST'});location.reload()}me()</script></body></html>
